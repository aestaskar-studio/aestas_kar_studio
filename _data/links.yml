# 参考リンク集のデータ
# カテゴリ（ツール）を増やすときは「- category:」のブロックを追加します。
# ヘッダーの「Links」にカーソルを合わせると、ここのカテゴリがメニューに並びます。
#
# - category: カテゴリ名
#   description: メニューに出る一言説明
#   links:
#     - name: リンク名
#       url: https://...
#       desc: 一言メモ（省略可）

- category: GitHub
  description: リポジトリ・Pages・Actions
  links:
    - name: GitHub Docs
      url: https://docs.github.com/ja
      desc: GitHub公式ドキュメント（日本語）
    - name: GitHub Pages
      url: https://docs.github.com/ja/pages
      desc: Pagesでのサイト公開
    - name: GitHub CLI マニュアル
      url: https://cli.github.com/manual/
      desc: gh コマンドのリファレンス

